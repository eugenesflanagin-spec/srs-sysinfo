# Build, install-test and release srs-sysinfo packages.
#
# How it runs:
#   * Push a tag like v1.2.0  -> builds everything, tests everything, and (only if
#     all tests pass) creates the GitHub release with the files attached.
#   * "Run workflow" button (or: gh workflow run release.yml --ref BRANCH)
#     -> same builds and tests, but NO release: the files are kept as
#     downloadable "artifacts" on the workflow run page for a few days.
#
# Every step calls a script in packaging/ that you can also run on your own PC
# (packaging/build-all.sh runs them all). Each package is built inside a fresh
# Docker container of its distro and then installed into another fresh one.
# See packaging/README.md for the whole release routine.

name: Release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# By default the jobs may only read the repository. Only the final "release"
# job gets permission to create releases (see below).
permissions:
  contents: read

# Never run two release builds for the same tag/branch at the same time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1. Read the version, check it matches the tag, and pack the source.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read SRS_VERSION and check it against the tag
        id: ver
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VER=$(packaging/release-info.sh version)
          echo "SRS_VERSION in srs.h: $VER"
          # On a tag push the tag must be exactly "v" + SRS_VERSION; stop here if not.
          if [ "$REF_TYPE" = tag ]; then
            packaging/release-info.sh check "$REF_NAME"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Make the source tarball (git archive)
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p source
          git archive --format=tar.gz --prefix="srs-sysinfo-$VER/" -o "source/srs-sysinfo-$VER.tar.gz" HEAD
          ls -l source

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source
          path: source/
          if-no-files-found: error

  # 2. Build one package per distro, each in a fresh container of that distro.
  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # let the other distros finish even if one fails
      matrix:
        distro: [arch, debian-13, ubuntu-24.04, fedora-44, opensuse-tumbleweed]
    env:
      VER: ${{ needs.prepare.outputs.version }}
      DISTRO: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: source/
      - name: Build the ${{ matrix.distro }} package
        run: packaging/build.sh "$DISTRO" "source/srs-sysinfo-$VER.tar.gz" "out/$DISTRO"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-${{ matrix.distro }}
          path: out/${{ matrix.distro }}/
          if-no-files-found: error

  # 3. Install each package in a FRESH container of its distro and run packaging/test.sh.
  test:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [arch, debian-13, ubuntu-24.04, fedora-44, opensuse-tumbleweed]
    env:
      VER: ${{ needs.prepare.outputs.version }}
      DISTRO: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pkg-${{ matrix.distro }}
          path: built/
      - name: Install-test the ${{ matrix.distro }} package
        run: packaging/test-in-container.sh "$DISTRO" built/pkg "$VER"

  # 4. The generic Linux tarball, made from the Ubuntu 24.04 package (older glibc,
  #    so it runs on more distributions than one made from the Arch package).
  tarball:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      VER: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: source/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pkg-ubuntu-24.04
          path: ubuntu-24.04/
      - name: Make srs-sysinfo-${{ needs.prepare.outputs.version }}-linux-x86_64.tar.gz
        run: packaging/make-tarball.sh "ubuntu-24.04/pkg/srs-sysinfo_$VER-1.ubuntu24.04_amd64.deb" "source/srs-sysinfo-$VER.tar.gz" tarball/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarball
          path: tarball/
          if-no-files-found: error

  # 5. The AppImage for any distribution (built in an Ubuntu 22.04 container, so it
  #    runs on glibc 2.35 and newer), with its .zsync file for AppImageUpdate.
  appimage:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VER: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: source/
      - name: Build srs-sysinfo-${{ needs.prepare.outputs.version }}-x86_64.AppImage
        run: packaging/build-appimage.sh "source/srs-sysinfo-$VER.tar.gz" appimage/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage
          path: appimage/
          if-no-files-found: error

  # 6. Start the AppImage in fresh Debian 12 and Fedora 44 containers (GTK 3, Xvfb and
  #    fonts only): --version, the command line, and the GUI window under Xvfb.
  appimage-test:
    needs: [prepare, appimage]
    runs-on: ubuntu-latest
    env:
      VER: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: appimage
          path: appimage/
      - name: Start-test the AppImage
        run: packaging/test-appimage.sh "appimage/srs-sysinfo-$VER-x86_64.AppImage" "$VER" debian:12 fedora:44

  # 7. Put every release file in one place with SHA256SUMS and the release notes.
  #    Runs on every run (also "Run workflow"), so a test run shows exactly what
  #    a release would contain: download the "release-files" artifact.
  assemble:
    needs: [prepare, test, tarball, appimage-test]
    runs-on: ubuntu-latest
    env:
      VER: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pkg-*
          path: built/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarball
          path: built/tarball/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: appimage
          path: built/appimage/
      - name: Collect the files and write SHA256SUMS
        run: |
          mkdir -p release
          cp built/pkg-*/pkg/* built/tarball/*.tar.gz release/
          cp built/appimage/*.AppImage built/appimage/*.AppImage.zsync release/
          cp docs/SRS-User-Guide.pdf release/
          # the user guide PDF must be a real PDF, not a placeholder
          [ "$(head -c5 release/SRS-User-Guide.pdf)" = "%PDF-" ]
          (cd release && sha256sum -- * > SHA256SUMS)
          # 5 packages + tarball + AppImage + .zsync + PDF + SHA256SUMS
          n=$(find release -type f | wc -l); [ "$n" -eq 10 ] || { echo "::error::expected 10 release files, got $n"; ls -l release; exit 1; }
          ls -l release; cat release/SHA256SUMS
      - name: Release notes
        run: |
          packaging/release-info.sh notes "v$VER" > release-notes.md
          packaging/release-info.sh title "v$VER" > release-title.txt
          echo "Title: $(cat release-title.txt)"; cat release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            release/
            release-notes.md
            release-title.txt
          if-no-files-found: error

  # 8. Create the GitHub release. Only for tag pushes, and only after every
  #    build and install test above has passed.
  release:
    if: github.ref_type == 'tag'
    needs: [prepare, assemble]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create the release and upload files
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: .
      - name: Create the release
        run: |
          ls -l release
          # A published release for this tag already exists: stop, don't overwrite
          # files people may have downloaded. A leftover draft (an earlier run that
          # failed half-way) is finished instead.
          if state=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$state" = true ]; then
              echo "Draft release $TAG exists: uploading the files again and publishing it"
              gh release upload "$TAG" release/* --clobber
              gh release edit "$TAG" --title "$(cat release-title.txt)" --notes-file release-notes.md --draft=false
            else
              echo "::error::release $TAG is already published; delete it first (gh release delete $TAG) if you want to rebuild it"
              exit 1
            fi
          else
            gh release create "$TAG" release/* --verify-tag \
              --title "$(cat release-title.txt)" --notes-file release-notes.md
          fi
          gh release view "$TAG" --json url,assets -q '.url, (.assets[] | .name)'
